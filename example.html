<style>
:root{--navy:#173b5e;--teal:#187a88;--ink:#243549;--muted:#627489;--line:#dae4ec;--canvas:#f4f7fb;--white:#fff;--mint:#dff4f0;--amber:#fff0d6}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#edf5fa 0%,#f7f8fb 57%,#eef8f5 100%);font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:var(--ink);font-size:15px;line-height:1.65}
header{background:#173b5e;color:white;padding:14px max(20px,calc((100vw - 960px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}
header .brand{font-weight:800;letter-spacing:.2px}header .meta{font-size:12px;color:#bcd4e3}
.main{max-width:960px;margin:34px auto;padding:0 20px 40px}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px}
.panel{background:white;border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 30px rgba(17,50,78,.05);padding:26px}.side{align-self:start;position:sticky;top:20px;padding:21px}
.eyebrow{font-weight:800;letter-spacing:1.2px;font-size:11px;color:var(--teal)}h1{font-size:28px;line-height:1.28;margin:9px 0 12px;color:var(--navy)}h2{font-size:19px;margin:12px 0 6px;color:var(--navy)}p{margin:7px 0 15px}small,.small{font-size:12px;color:var(--muted)}
.steps{margin-top:18px;display:grid;gap:11px}.step{display:flex;gap:11px;align-items:center;font-size:13px;color:#718196}.step .n{width:25px;height:25px;border-radius:9px;background:#e9eff4;display:grid;place-items:center;font-weight:700;flex-shrink:0}.step.current{font-weight:800;color:var(--navy)}.step.current .n{background:var(--teal);color:white}.step.past .n{background:#d7f2e7;color:#176b5a}
.progress-line{height:8px;background:#e9eff3;border-radius:999px;overflow:hidden;margin:8px 0 3px}.progress-line span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#5babb9);transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.skill{border:2px solid var(--line);padding:15px 13px;border-radius:14px;background:#fff;cursor:pointer;min-height:152px;text-align:left;display:flex;flex-direction:column;gap:6px}.skill.selected{border-color:var(--teal);background:#effbf8}.skill:hover{border-color:#7bb4bd}.skill .s-name{font-weight:800;color:var(--navy)}.skill .s-desc{font-size:12px;color:var(--muted)}.tag{display:inline-block;background:#e3f1f6;color:#20586f;border-radius:7px;padding:3px 8px;font-size:11px;font-weight:750}
.field{margin:21px 0 16px}.field label{display:block;font-weight:800;margin-bottom:6px}.req{color:#bb5c2c;font-size:11px;margin-left:5px}.field textarea{width:100%;min-height:95px;padding:13px 14px;border:1px solid #c8d6e0;border-radius:12px;resize:vertical;font:inherit;background:#fff;color:var(--ink);outline:none}.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #e0f5f4}.field textarea:disabled{background:#f2f4f5;color:#87919a}.field .q{margin:0 0 8px;font-size:14px;color:#364c60}.field .help{display:flex;gap:9px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
button{font:inherit;cursor:pointer}.btn{border:0;border-radius:11px;padding:12px 17px;font-weight:800;background:var(--navy);color:white}.btn:hover{filter:brightness(1.1)}.btn.secondary{border:1px solid #cad7e1;background:white;color:var(--navy)}.btn.ghost{border:0;background:transparent;color:#1a7480;padding:4px 3px;font-size:12px}.btn:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid #e7edf1;padding-top:20px;margin-top:23px}.hint{background:#eaf8f5;border-left:3px solid #4fa89a;border-radius:8px;padding:11px 12px;color:#1b5c57;font-size:13px;margin-top:9px}.notice{background:#f3f7fb;border-radius:12px;padding:13px 15px;font-size:13px;color:#40576e;margin:12px 0 16px}.warning{background:#fff6e9;border-radius:12px;padding:13px 15px;font-size:13px;color:#79502a;margin:12px 0 16px}.error{color:#bb4b37;font-size:13px;margin-top:8px;min-height:20px}
.summary{display:grid;gap:9px;margin:18px 0}.summary .item{border:1px solid #e3ebf1;background:#f9fbfd;padding:10px 13px;border-radius:10px}.summary .item b{display:block;color:#2a5a77;font-size:12px}.summary .item span{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}

<script>
const CFG=JSON.parse(document.getElementById('guide-config').textContent);
const KEY='pathfinder_v2_20261110';
const fresh=()=>({page:0,skill:'',answers:{},noExperience:false,hints:{},scores:{},focus:'',indSkill:'',ind:{},review:{},events:[],monthShift:0,error:'',toast:''});
let state=fresh();
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&saved.answers&&saved.scores){state={...fresh(),...saved,page:Math.min(7,Math.max(0,+saved.page||0))};}}catch(e){}
const names=['안내','역량 선택','나의 경험','역량 비교·목표','실행 계획·달력','계획 검토','혼자 계획하기','완료'];
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const byId=id=>CFG.competencies.find(c=>c.id===id)||CFG.competencies[0];
const answers=q=>state.answers[q]||'';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function header(t,sub){return `<div class="eyebrow">STEP ${String(Math.min(state.page,6)).padStart(2,'0')} / 06</div><h1>${esc(t)}</h1><p class="small">${esc(sub)}</p>`;}
function nav(next='다음 단계',back=true){return `<div class="actions">${back?'<button type="button" class="btn secondary" data-act="back">← 이전</button>':'<div></div>'}<button type="button" class="btn" data-act="next">${esc(next)} →</button></div>`;}
function card(c,selected,action='skill'){return `<button type="button" class="skill ${selected?'selected':''}" data-act="${action}" data-id="${c.id}" aria-pressed="${selected}"><span class="s-name">${esc(c.name)} ${selected?'✓':''}</span><span class="s-desc">${esc(c.desc)}</span><span class="small" style="margin-top:auto">${esc(c.examples[0])}</span></button>`;}
function chips(id){const opts=(CFG.question_chip_options[id]||{})[state.skill]||[];if(!opts.length)return '';return `<div class="muted-note">선택해서 답변 시작하기 (직접 수정 가능)</div><div class="chip-row">${opts.map((v,i)=>`<button type="button" class="chip" data-act="chip" data-id="${id}" data-val="${i}">+ ${esc(v)}</button>`).join('')}</div>`;}
function question(q,options={}){
 const disabled=state.noExperience&&['Q01','Q02'].includes(q.id);
 const doHint=state.hints[q.id];
 return `<div class="field"><label for="${q.id}">${esc(q.id)} · ${esc(q.label)} ${q.required?'<span class="req">필수</span>':''}</label><div class="q">${esc(q.prompt)}</div>${chips(q.id)}<textarea id="${q.id}" data-answer="${q.id}" ${disabled?'disabled':''} placeholder="${esc(q.placeholder)}">${esc(answers(q.id))}</textarea><div class="help"><button type="button" class="btn ghost" data-act="hint" data-id="${q.id}">${doHint?'− 힌트 닫기':'+ 다른 관점이 필요해요'}</button><span>내 언어로 짧게 작성하면 됩니다.</span></div>${doHint&&!disabled?`<div class="hint">${esc(q.hint)}</div>`:''}</div>`;
}
function qids(ids){return CFG.questions.filter(q=>ids.includes(q.id)).map(q=>question(q)).join('');}
function compare(){const levels=CFG.target_levels;return `<div class="notice"><b>직무 요구 역량과 나의 현재 수준 비교</b><div>각 슬라이더는 본인이 느끼는 수행 수준(0~100%)입니다. 목표선은 <b>설계 검토를 위한 시연용 가정치</b>이며 실제 채용 기준이나 객관적인 진단 결과가 아닙니다.</div></div>${CFG.competencies.map(c=>{
 let score=state.scores[c.id]; const val=Number.isFinite(score)?score:50;const target=levels[c.id];const gap=Number.isFinite(score)?Math.max(0,target-val):null;
 return `<div class="rating-card ${state.skill===c.id?'active':''}" data-rating-card="${c.id}"><div class="rating-head"><b>${esc(c.name)} ${state.skill===c.id?'<span class="tag">집중 역량</span>':''}</b><span id="scoreLabel_${c.id}">${gap===null?'미설정':val+'%'}</span></div><div class="rating-track"><div class="rating-fill" id="fill_${c.id}" style="width:${gap===null?0:val}%"></div><div class="rating-target" style="left:${target}%"></div></div><div class="key-row"><span><span class="dot"></span>나의 수준 <b id="scoreText_${c.id}">${gap===null?'미평가':val+'%'}</b></span><span><span class="dot target"></span>시연용 목표 <b>${target}%</b></span><span id="gap_${c.id}">${gap===null?'비교 전':'차이 '+gap+'%p'}</span></div><label for="score_${c.id}" class="small">현재 수준 직접 조정</label><input id="score_${c.id}" type="range" min="0" max="100" step="5" value="${val}" data-score="${c.id}" aria-label="${esc(c.name)} 자기평가"></div>`;
 }).join('')}<div class="muted-note">점수에 정답은 없습니다. 반드시 실제 경험과 수행 가능 여부를 참고해 판단하세요.</div>`;}
function focus(){const subs=CFG.subskills[state.skill]||[];return `<div class="field"><label>Q06 · 먼저 집중할 세부 역량 <span class="req">필수</span></label><div class="q">하나를 선택한 뒤 이유를 짧게 작성해 보세요.</div><div class="subchoices">${subs.map((s,i)=>`<label class="subchoice ${state.focus===s?'selected':''}"><input type="radio" name="focus" value="${i}" ${state.focus===s?'checked':''} data-focus="${i}"><span>${esc(s)}</span></label>`).join('')}</div><textarea id="Q06" data-answer="Q06" placeholder="${esc(CFG.questions.find(q=>q.id==='Q06').placeholder)}">${esc(answers('Q06'))}</textarea></div>`;}
function resources(){return `<div class="field"><label>Q11 · 필요한 정보와 자료 찾기 <span class="small">선택</span></label><div class="q">여러 사이트를 직접 검색하지 않도록 선택 역량에 맞는 자료 3개만 먼저 보여줍니다. 현직자 경험·멘토링도 포함했어요.</div><div class="resource-list">${CFG.resource_catalog[state.skill].map((r,i)=>`<a class="resource" href="${r.url}" target="_blank" rel="noopener noreferrer"><span class="tag">${esc(r.category)}</span><b>${esc(r.name)}</b><span class="small">${esc(r.desc)}</span><span class="ext">사이트 열기 ↗</span></a>`).join('')}</div><textarea id="Q11" data-answer="Q11" placeholder="예: Google Analytics 실습 자료 확인 후 분석 리포트 시도하기">${esc(answers('Q11'))}</textarea><p class="muted-note">링크는 외부 사이트로 이동합니다. 가격·강좌 개설 여부·멘토 연결은 각 사이트에서 확인하세요.</p></div>`;}
function formatDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function calendar(){const now=new Date();const base=new Date(now.getFullYear(),now.getMonth()+state.monthShift,1);const yr=base.getFullYear(), mo=base.getMonth();const first=new Date(yr,mo,1).getDay();const total=new Date(yr,mo+1,0).getDate();const cells=Math.ceil((first+total)/7)*7;const weeks=['일','월','화','수','목','금','토'];
 const h=`<div class="calendar-bar"><b>${yr}년 ${mo+1}월</b><div class="inline-actions" style="margin:0"><button type="button" class="btn ghost" data-act="month-prev">◀</button><button type="button" class="btn ghost" data-act="month-now">이번 달</button><button type="button" class="btn ghost" data-act="month-next">▶</button></div></div>`;
 const days=Array.from({length:cells},(_,i)=>{const d=i-first+1; const date=new Date(yr,mo,d);const dateStr=formatDate(date);const inMonth=d>=1&&d<=total;const hits=state.events.filter(e=>e.date===dateStr);const isToday=dateStr===formatDate(now);return `<div class="day ${inMonth?'':'dim'} ${isToday?'today':''}"><span class="num">${date.getDate()}</span>${hits.slice(0,2).map(e=>`<span class="cal-tag" title="${esc(e.title)}">${esc(e.title)}</span>`).join('')}${hits.length>2?`<span class="cal-tag">+${hits.length-2}개</span>`:''}</div>`;}).join('');
 return `<h2>캘린더에 실행 일정 넣기 <span class="tag">선택 기능</span></h2><p class="small">계획을 실제 날짜에 배치해보세요. 등록한 활동은 아래 달력과 내보내기 파일에 반영됩니다.</p><div class="calendar-input"><div class="field first"><label for="eventTitle">활동</label><input id="eventTitle" type="text" placeholder="예: 콘텐츠 3개 성과 비교"></div><div class="field"><label for="eventDate">날짜</label><input id="eventDate" type="date" value="${formatDate(now)}"></div><div class="field"><label for="eventMin">시간(분)</label><input id="eventMin" type="number" min="10" max="600" step="10" value="30"></div><button type="button" class="btn" data-act="add-event" style="margin-bottom:7px">일정 추가</button></div><div class="toast" id="toast">${esc(state.toast)}</div><div class="calendar-wrap">${h}<div class="month-grid">${weeks.map(w=>`<div class="weekday">${w}</div>`).join('')}${days}</div></div>${state.events.length?`<div class="task-list">${state.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="task"><span><b>${esc(e.title)}</b><span class="muted-note"> · ${esc(e.date)} · ${e.minutes}분</span></span><button type="button" class="remove" data-act="remove-event" data-id="${esc(e.id)}">삭제</button></div>`).join('')}</div><button type="button" class="btn secondary" data-act="ics">캘린더 파일(.ics) 내보내기 ↓</button>`:'<div class="muted-note">등록한 일정이 없습니다. 필요하다면 하나만 추가해 보세요.</div>'}`;}
function review(){const items=CFG.questions.filter(q=>['S02','S03','S04'].includes(q.screen)&& !(state.noExperience&&['Q01','Q02'].includes(q.id)));return `<div class="summary">${items.map(q=>`<div class="item"><b>${esc(q.id)} · ${esc(q.label)}</b><span>${esc(answers(q.id)||'입력 없음')}</span></div>`).join('')}<div class="item"><b>우선순위 세부 역량</b><span>${esc(state.focus||'선택 안 함')}</span></div><div class="item"><b>등록한 캘린더 일정</b><span>${state.events.length}개</span></div></div><h2>실행 가능성 직접 점검하기</h2>${['목표와 현재 역량을 연결했나요?','목표가 구체적인 행동과 결과물인가요?','학습 활동의 방법이 명확한가요?','일정·순서가 현실적인가요?','달성 여부를 판단할 기준이 있나요?'].map((t,i)=>`<label class="check"><input type="checkbox" data-review="${i}" ${state.review[i]?'checked':''}><span>${t}</span></label>`).join('')}<p class="muted-note">자동 채점이 아니라 학습자 자신의 점검입니다. 이전 버튼으로 언제든 수정할 수 있어요.</p>`;}
function pageBody(){switch(state.page){
 case 0:return header('내가 직접 만드는 4주 진로 학습 계획','관심 역량과 나의 수준을 비교하며 작은 실행 계획을 완성하는 연습')+`<div class="notice"><b>학습 흐름</b><p>① 역량 선택 → ② 지금 할 수 있는 일 → ③ 역량 비교 → ④ 목표·실행 일정 → ⑤ 계획 검토 → ⑥ 힌트 없이 새로운 계획 작성</p></div><p>이 사이트는 계획을 대신 써주지 않습니다. 질문과 선택지를 통해 <b>내가 생각하고 결정하는 과정을 돕는</b> 시제품입니다.</p><div class="grid">${['필요한 것만 한 단계씩','역량 수준을 직접 비교','마지막은 혼자 계획'].map((s,i)=>`<div class="notice" style="margin:0">${['🧩','📊','🗓️'][i]}<br><b>${s}</b></div>`).join('')}</div><div class="warning">시연 범위: 마케팅 직무 3가지 역량 · 설명용 목표치 · 실제 AI 연동 없음 · 입력 내용은 브라우저에만 저장. 실명이나 연락처는 입력하지 마세요.</div>${nav('시작하기',false)}`;
 case 1:return header('어떤 역량부터 시작할까요?','직무: 디지털 마케팅 · 학습할 역량 하나를 먼저 선택해 주세요.')+`<div class="notice"><b>대표 직무: 디지털 마케팅</b><div>데이터를 해석하고 콘텐츠를 설계하며 필요한 곳에 생성형 AI를 활용하는 일을 시연합니다. 실제 기업마다 요구 역량은 달라질 수 있습니다.</div></div><div class="grid">${CFG.competencies.map(c=>card(c,state.skill===c.id)).join('')}</div>${nav('내 현재 수준 확인')}`;
 case 2:return header('내가 할 수 있는 일은 무엇일까요?',`선택한 역량: ${byId(state.skill).name}`)+`<div class="notice">화려한 경험이 없어도 됩니다. 경험이 없다면 체크하고, 현재 가능한 작은 행동과 막히는 지점을 짧게 적어주세요.</div><label class="check"><input id="noexp" type="checkbox" ${state.noExperience?'checked':''}><span>관련 경험이 아직 없어요 (Q01·Q02 생략)</span></label>${qids(['Q01','Q02','Q03','Q04'])}${nav('역량 비교하기')}`;
 case 3:return header('내 현재 역량과 목표를 비교해요',`선택한 역량: ${byId(state.skill).name}`)+compare()+qids(['Q05'])+focus()+qids(['Q07','Q08'])+nav('실행 계획 세우기');
 case 4:return header('실천할 수 있는 계획을 작성해요',`선택한 역량: ${byId(state.skill).name}`)+`<div class="notice"><b>계획의 기준</b><p>자료 읽기만이 아니라, 직접 수행할 행동·만들 결과물·실행할 날짜를 구체화해 보세요.</p></div>${qids(['Q09','Q10'])}${resources()}${qids(['Q12'])}${calendar()}${nav('계획 검토하기')}`;
 case 5:return header('내가 세운 계획을 검토해요','입력한 답변을 모았습니다. 고칠 점이 보이면 이전 단계에서 수정할 수 있어요.')+review()+qids(['Q13','Q14'])+nav('새로운 역량 혼자 계획하기');
 case 6:return header('이제 도움 없이 새 역량을 계획해 보세요','앞서 사용한 질문·힌트·답변은 보여주지 않습니다.')+`<div class="warning">앞에서 연습한 역량(<b>${esc(byId(state.skill).name)}</b>)과 다른 것을 하나 선택하고, 아무 안내 없이 혼자 계획해 보세요.</div><div class="grid">${CFG.competencies.filter(c=>c.id!==state.skill).map(c=>card(c,state.indSkill===c.id,'indskill')).join('')}</div>${CFG.assessment_fields.map(f=>`<div class="field"><label for="${f.id}">${esc(f.label)} <span class="req">필수</span></label><textarea id="${f.id}" data-ind="${f.id}" placeholder="${esc(f.placeholder)}">${esc(state.ind[f.id]||'')}</textarea></div>`).join('')}${nav('독립 미션 완료',false)}`;
 case 7:return header('나만의 계획을 완성했어요','첫 역량을 계획하고, 다른 역량에 스스로 적용해 보았습니다.')+`<div class="notice"><b>결과 정리</b><p>선택한 집중 역량: <b>${esc(byId(state.skill).name)}</b><br>집중할 세부 역량: <b>${esc(state.focus||'')}</b><br>주요 목표: <b>${esc(answers('Q07'))}</b><br>달력에 등록한 일정: <b>${state.events.length}개</b></p></div><p>완료는 활동을 마쳤다는 뜻이며 학습 효과가 입증되었다는 의미는 아닙니다. 결과를 파일로 저장하여 시연이나 팀원 검토에 사용하세요.</p><div class="inline-actions"><button type="button" class="btn" data-act="export">답변 JSON 저장 ↓</button><button type="button" class="btn secondary" data-act="ics" ${state.events.length?'':'disabled'}>일정(.ics) 저장 ↓</button><button type="button" class="btn secondary" data-act="reset">처음부터 다시</button></div>`;
 }}
function show(){const el=document.getElementById('content');el.innerHTML=pageBody()+`<div id="err" class="error" role="alert" aria-live="polite">${esc(state.error)}</div>`;
 const pct=Math.min(100,Math.max(0,Math.round((state.page-1)/6*100)));document.getElementById('pbar').style.width=pct+'%';document.getElementById('pval').textContent=`전체 활동 진행 ${pct}%`;
 document.getElementById('steps').innerHTML=names.slice(1,7).map((s,i)=>`<div class="step ${(i+1)<state.page?'past':(i+1)===state.page?'current':''}"><span class="n">${(i+1)<state.page?'✓':i+1}</span><span>${esc(s)}</span></div>`).join('');
 document.querySelectorAll('[data-answer]').forEach(el=>el.addEventListener('input',()=>{state.answers[el.dataset.answer]=el.value;save();}));
 document.querySelectorAll('[data-ind]').forEach(el=>el.addEventListener('input',()=>{state.ind[el.dataset.ind]=el.value;save();}));
 document.querySelectorAll('[data-review]').forEach(el=>el.addEventListener('change',()=>{state.review[el.dataset.review]=el.checked;save();}));
 document.querySelectorAll('[data-focus]').forEach(el=>el.addEventListener('change',()=>{state.focus=CFG.subskills[state.skill][Number(el.dataset.focus)];save();show();}));
 document.querySelectorAll('[data-score]').forEach(el=>el.addEventListener('input',()=>{const id=el.dataset.score;const val=Number(el.value);state.scores[id]=val;const target=CFG.target_levels[id];document.getElementById('scoreLabel_'+id).textContent=val+'%';document.getElementById('scoreText_'+id).textContent=val+'%';document.getElementById('fill_'+id).style.width=val+'%';document.getElementById('gap_'+id).textContent='차이 '+Math.max(0,target-val)+'%p';save();}));
 const ne=document.getElementById('noexp');if(ne)ne.addEventListener('change',()=>{state.noExperience=ne.checked;if(ne.checked){delete state.answers.Q01;delete state.answers.Q02;}save();show();});
 document.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click',act));save();}
function validate(){let err='';if(state.page===1&&!state.skill)err='시작할 역량 한 가지를 골라주세요.';
 if([2,3,4,5].includes(state.page)){
 const reqByPage={2:['Q03','Q04'],3:['Q05','Q06','Q07','Q08'],4:['Q09','Q10'],5:['Q13']};
 const missing=reqByPage[state.page].find(id=>!String(answers(id)).trim());
 if(missing)err=`${missing} 내용을 입력해주세요. 길게 작성하지 않아도 괜찮아요.`;
 if(state.page===3 && !Number.isFinite(state.scores[state.skill]))err='선택한 역량의 현재 수준을 슬라이더로 직접 평가해 주세요.';
 if(state.page===3 && !state.focus)err='먼저 집중할 세부 역량 하나를 선택해 주세요.';
 }
 if(state.page===6){if(!state.indSkill)err='다른 역량을 선택해 주세요.';else{const miss=CFG.assessment_fields.find(f=>!String(state.ind[f.id]||'').trim());if(miss)err=`독립 단계: ${miss.label}을 작성해 주세요.`;}}
 state.error=err;if(err){show();document.getElementById('err').scrollIntoView({behavior:'smooth',block:'center'});return false;}return true;
}
function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),6000);}
function exportJSON(){const out={meta:{project:'pathfinder',version:'2.0',exportedAt:new Date().toISOString(),note:'자가평가/시연용. 외부 서버 전송 없음.'},selected_skill:state.skill,scores:state.scores,target_levels:CFG.target_levels,focus:state.focus,answers:state.answers,independent_skill:state.indSkill,independent_plan:state.ind,calendar_events:state.events,review:state.review};download('pathfinder_학습계획_v2.json',JSON.stringify(out,null,2),'application/json;charset=utf-8');}
function exportICS(){
 if(!state.events.length){alert('내보낼 일정이 없습니다.');return;}
 const NL='\r\n';
 const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
 const safe=s=>String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
 const evs=state.events.flatMap(e=>{
   const start=e.date.replaceAll('-','');
   const nextDay=new Date(new Date(e.date+'T12:00:00').getTime()+86400000);
   const end=formatDate(nextDay).replaceAll('-','');
   return ['BEGIN:VEVENT','UID:'+e.id+'@pathfinder.local','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+start,'DTEND;VALUE=DATE:'+end,'SUMMARY:'+safe(e.title),'DESCRIPTION:'+safe(e.minutes+'분 학습 활동 (시간 미지정)'),'END:VEVENT'];
 });
 const contents=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Pathfinder Demo//KO','CALSCALE:GREGORIAN',...evs,'END:VCALENDAR'].join(NL)+NL;
 download('pathfinder_학습일정.ics',contents,'text/calendar;charset=utf-8');
}
function act(e){const action=e.currentTarget.dataset.act,id=e.currentTarget.dataset.id;
 if(action==='skill'){if(state.skill&&state.skill!==id&&Object.keys(state.answers).length){if(!confirm('역량을 바꾸면 작성한 답변과 일정이 초기화됩니다. 계속할까요?'))return;state.answers={};state.scores={};state.focus='';state.events=[];state.hints={};state.noExperience=false;}state.skill=id;state.error='';show();return;}
 if(action==='indskill'){state.indSkill=id;show();return;}
 if(action==='hint'){state.hints[id]=!state.hints[id];show();return;}
 if(action==='chip'){const options=CFG.question_chip_options[id]?.[state.skill]||[];const s=options[Number(e.currentTarget.dataset.val)];if(s){const before=answers(id);state.answers[id]=before.trim()?before.trim()+' / '+s:s;show();document.getElementById(id)?.focus();}return;}
 if(action==='back'){state.page=Math.max(0,state.page-1);state.error='';show();window.scrollTo(0,0);return;}
 if(action==='next'){if(!validate())return;state.page=Math.min(7,state.page+1);state.error='';show();window.scrollTo(0,0);return;}
 if(action==='month-prev'){state.monthShift--;show();return;}
 if(action==='month-next'){state.monthShift++;show();return;}
 if(action==='month-now'){state.monthShift=0;show();return;}
 if(action==='add-event'){const title=document.getElementById('eventTitle').value.trim();const date=document.getElementById('eventDate').value;const minutes=Number(document.getElementById('eventMin').value);if(!title||!/^\d{4}-\d\d-\d\d$/.test(date)||minutes<10||minutes>600){state.toast='활동·날짜·10~600분을 확인해 주세요.';document.getElementById('toast').textContent=state.toast;return;}state.events.push({id:String(Date.now())+Math.random().toString(36).slice(2,6),title,date,minutes});const d=new Date(date+'T12:00:00'),now=new Date();state.monthShift=(d.getFullYear()-now.getFullYear())*12+d.getMonth()-now.getMonth();state.toast='일정을 추가했습니다.';show();return;}
 if(action==='remove-event'){state.events=state.events.filter(e=>e.id!==id);state.toast='일정을 삭제했습니다.';show();return;}
 if(action==='ics'){exportICS();return;}
 if(action==='export'){exportJSON();return;}
 if(action==='reset'){if(!confirm('이 브라우저에 저장된 답변과 계획을 모두 지울까요?'))return;try{localStorage.removeItem(KEY);}catch(e){}state=fresh();show();return;}
}
show();
</script></body></html>
