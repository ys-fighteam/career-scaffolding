<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>진로 스캐폴딩 플랫폼</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.63.1/build/stlite.css" />
  <style>
    html,
    body,
    #root {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.63.1/build/stlite.js"></script>
  <script>
    window.addEventListener("message", function (event) {
      if (event.data && event.data.type === "PATHFINDER_SCROLL_TOP") {
        const selectors = [
          '[data-testid="stAppViewContainer"]',
          '[data-testid="stMain"]',
          "section.main",
          ".main",
          ".stApp",
          "#root",
          "html",
          "body",
        ];
        selectors.forEach(function (sel) {
          const el = document.querySelector(sel);
          if (el) {
            el.scrollTo({ top: 0, left: 0, behavior: "instant" });
            el.scrollTop = 0;
          }
        });
        window.scrollTo(0, 0);
      }
    });

    stlite.mount(
      {
        entrypoint: "app.py",
        files: {
          "app.py": {
            url: "./app.py",
          },
        },
      },
      document.getElementById("root")
    );
  </script>
</body>

</html>
